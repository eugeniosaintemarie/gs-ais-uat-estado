<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIS UAT estado</title>
    <style>
      body {
        background-color: black;
        color: white;
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .status {
        font-size: 48px;
        font-weight: bold;
        margin-bottom: 20px;
      }
      .available {
        color: #4caf50;
      }
      .unavailable {
        color: #f44336;
      }
      .date {
        font-size: 24px;
      }
    </style>
  </head>
  <body>
    <div id="status" class="status">DISPONIBLE</div>
    <div id="date" class="date">1/8/2032</div>
  </body>
</html>
